name: Validate and deploy to Vercel

on:
  push:
    branches: [main, master, trststudios-storefront]
  pull_request:
    branches: [main, master, trststudios-storefront]
  workflow_dispatch:

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --linker hoisted --backend=copyfile
      - run: bun run build
      - name: Deploy to Vercel
        # Explicit opt-in: the repository's existing VERCEL_TOKEN secret is rejected
        # by Vercel CLI. Keep release validation green while production deploys
        # are performed through the authenticated Vercel integration.
        # Re-enable only after rotating the token and setting the repo variable.
        if: github.event_name != 'pull_request' && vars.VERCEL_CLI_DEPLOY_ENABLED == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/trststudios-storefront')
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ] || [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::Vercel deployment skipped: configure VERCEL_ORG_ID, VERCEL_PROJECT_ID, and VERCEL_TOKEN repository secrets."
            exit 0
          fi
          npx vercel@latest --prod --yes
      - name: Report Vercel deployment channel
        if: github.event_name != 'pull_request' && vars.VERCEL_CLI_DEPLOY_ENABLED != 'true'
        run: echo "::notice::GitHub CLI production deploy disabled until the Vercel CLI token is repaired. Release builds use Vercel's production-environment deployment API."
