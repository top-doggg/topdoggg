name: Validate and deploy to Vercel

on:
  push:
    branches: [main, master, trststudios-storefront]
  pull_request:
    branches: [main, master, trststudios-storefront]
  workflow_dispatch:

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --linker hoisted --backend=copyfile
      - run: bun run build
      - name: Deploy to Vercel
        if: github.event_name != 'pull_request'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ] || [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::Vercel deployment skipped: configure VERCEL_ORG_ID, VERCEL_PROJECT_ID, and VERCEL_TOKEN repository secrets."
            exit 0
          fi
          npx vercel@latest --prod --yes
