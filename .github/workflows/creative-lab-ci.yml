name: TRST Creative Lab — source and build checks

on:
  push:
    branches:
      - creative/trststudios-site-lab
  pull_request:
    branches:
      - trststudios-storefront
    paths:
      - "src/**"
      - "api/**"
      - "scripts/**"
      - "tests/**"
      - "vercel.json"
      - "vite.config.js"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/creative-lab-ci.yml"
      - ".github/workflows/deploy.yml"
      - "playwright.production.config.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creative-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build TRST storefront
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun (match repository lockfile)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies without secrets
        run: bun install --frozen-lockfile --linker hoisted --backend=copyfile
      - name: Verify auth boundaries and curated assets
        run: bun run test
      - name: Validate discovery data
        run: bun run validate:discovery
      - name: Build site
        run: bun run build
      - name: Check generated pages and assets
        shell: bash
        run: |
          test -s dist/index.html
          test -s dist/shop.html
          test -s dist/work.html
          test -s dist/process.html
          test -s dist/sitemap.xml
          test -s dist/robots.txt
      - name: Report
        run: echo "Static checks passed. This does NOT verify Blob, Supabase, Printify or authenticated browser flows."
